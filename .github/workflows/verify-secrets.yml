name: Verify secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::604439173067:role/github/bun-ffi-structs-release
          aws-region: us-east-1
      - name: Fetch the release secrets
        uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3.0.2
        with:
          secret-ids: |
            NPM_TOKEN,bun-ffi-structs/release/NPM_TOKEN
          parse-json-secrets: false
      - name: Check NPM_TOKEN
        run: test -n "$NPM_TOKEN" && echo "NPM_TOKEN ok"
