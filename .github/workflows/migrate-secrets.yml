name: Migrate secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::604439173067:role/github/bun-ffi-structs-release
          aws-region: us-east-1

      - name: NPM_TOKEN
        env:
          V: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "$V" || { echo "NPM_TOKEN is empty"; exit 1; }
          aws secretsmanager put-secret-value --secret-id bun-ffi-structs/release/NPM_TOKEN --secret-string "$V" > /dev/null
